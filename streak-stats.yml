name: Update Streak Stats

on:
  schedule:
    - cron: "1 15 * * *"   # JST 00:01 (midnight)
    - cron: "0 23 * * *"   # JST 08:00 (morning)
    - cron: "0 7 * * *"    # JST 16:00 (afternoon)
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Sithija-Kalhara&theme=dark&hide_border=true&background=0D1117&stroke=58A6FF&ring=58A6FF&fire=FF6B6B&currStreakLabelColor=58A6FF&cache_seconds=1800
          path: profile/streak-stats.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak-stats.svg
          git commit -m "chore: update streak stats" || exit 0
          git push
